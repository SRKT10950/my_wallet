name: My Wallet 2.0 PWA Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: |
          cd website
          npm ci

      - name: Verify TypeScript & Build Release PWA
        run: |
          cd website
          npm run build

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web2.0-release
          path: build/web2.0/
