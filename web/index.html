<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="My Wallet - Personal Finance, Expense Tracking, Daily Budget & Product Manager.">
  <meta name="theme-color" content="#0E111F">

  <!-- iOS Meta Tags & Native Standalone Config for Home Screen App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Wallet">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">

  <!-- Preload core assets for 0ms cold start -->
  <link rel="preload" href="manifest.json" as="fetch" crossorigin="anonymous">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Wallet Enterprise PWA</title>
  <link rel="manifest" href="manifest.json">

  <!-- Custom PWA Manager -->
  <script src="pwa_manager.js"></script>

  <style>
    html, body {
      background-color: #080914;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      width: 100%;
      height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    /* Instant Native HTML/CSS Splash Screen (< 10ms render on iOS launch) */
    #app-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #080914;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    #app-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .splash-logo-container {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: linear-gradient(135deg, #16192E 0%, #0E111F 100%);
      border: 1.5px solid #00F5D4;
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .splash-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .splash-subtitle {
      color: #718096;
      font-size: 12px;
      margin-bottom: 24px;
    }
    .splash-loader-bar {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .splash-loader-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00F5D4, #6366F1);
      animation: splash-pulse 1.2s infinite linear;
      transform-origin: 0% 50%;
    }
    @keyframes splash-pulse {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #pwa-install-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: linear-gradient(135deg, #16192E 0%, #0E111F 100%);
      border: 1.5px solid #00F5D4;
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 16px;
      color: #FFFFFF;
      max-width: 90vw;
      width: 440px;
      transition: all 0.3s ease-in-out;
    }
    #pwa-install-banner.hidden {
      display: none !important;
      pointer-events: none !important;
    }
    .pwa-btn-install {
      background-color: #00F5D4;
      color: #000000;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .pwa-btn-close {
      background: transparent;
      color: #A0AEC0;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Instant Native HTML/CSS Splash Screen (< 10ms render on iOS launch) -->
  <div id="app-splash">
    <div class="splash-content">
      <div class="splash-logo-container">
        <img src="icons/Icon-192.png" alt="My Wallet Logo" class="splash-logo" onerror="this.src='apple-touch-icon.png'" />
      </div>
      <div class="splash-title">My Wallet</div>
      <div class="splash-subtitle">Personal Finance & Daily Tracker</div>
      <div class="splash-loader-bar">
        <div class="splash-loader-progress"></div>
      </div>
    </div>
  </div>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" class="hidden">
    <div style="font-size: 24px;">📱</div>
    <div style="flex: 1;">
      <div style="font-weight: bold; font-size: 14px;">Install My Wallet App</div>
      <div style="font-size: 11px; color: #A0AEC0;">Full-screen standalone & offline experience</div>
    </div>
    <button class="pwa-btn-install" onclick="triggerPwaInstall()">INSTALL</button>
    <button class="pwa-btn-close" onclick="closePwaBanner()">✕</button>
  </div>

  <script>
    let deferredPwaPrompt = null;
    const banner = document.getElementById('pwa-install-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPwaPrompt = e;
      if (banner && (!window.myWalletPwa || !window.myWalletPwa.isStandalone())) {
        banner.classList.remove('hidden');
      }
    });

    function triggerPwaInstall() {
      if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        deferredPwaPrompt.userChoice.then((choice) => {
          deferredPwaPrompt = null;
          if (banner) banner.classList.add('hidden');
        });
      } else {
        alert("To Install My Wallet:\n\n• On iPhone / iPad (Safari): Tap Share button (↑) -> 'Add to Home Screen'\n• On Android (Chrome): Tap Menu (⋮) -> 'Install app' or 'Add to Home screen'\n• On Windows / Mac / Linux: Click the Install icon in the browser address bar.");
      }
    }

    function closePwaBanner() {
      if (banner) banner.classList.add('hidden');
    }

    // Auto-remove splash screen when Flutter renders first frame
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('app-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    });

    // Safety fallback: dismiss splash after 4.5 seconds if first-frame event is delayed
    setTimeout(function() {
      const splash = document.getElementById('app-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    }, 4500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
