<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="My Wallet — Smart personal finance & wallet management app. Track expenses, manage budgets, and take control of your money.">
  <meta name="keywords" content="wallet, finance, money, budget, expense tracker, personal finance">
  <meta name="author" content="My Wallet">

  <!-- PWA / Theme -->
  <meta name="theme-color" content="#6C3DE8">
  <meta name="msapplication-TileColor" content="#0D0D1A">
  <meta name="msapplication-navbutton-color" content="#6C3DE8">

  <!-- iOS / Apple PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Wallet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.png"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>My Wallet</title>

  <style>
    /* PWA splash screen loader */
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0D1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #pwa-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #pwa-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6C3DE8, #2196F3, #00BCD4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(108, 61, 232, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-logo svg {
      width: 44px;
      height: 44px;
      fill: white;
    }

    .loader-text {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .loader-sub {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      margin-top: -16px;
    }

    .loader-dots {
      display: flex;
      gap: 8px;
    }

    .loader-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C3DE8, #00BCD4);
      animation: bounce 1.4s ease-in-out infinite;
    }

    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(108, 61, 232, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(108, 61, 232, 0.8); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-10px); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- PWA Loading screen shown before Flutter initializes -->
  <div id="pwa-loader">
    <div class="loader-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 7H3a1 1 0 0 0-1 1v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a1 1 0 0 0-1-1zM3 9h18v2H3V9zm0 4h18v6H3v-6z"/>
        <path d="M7 2h10a2 2 0 0 1 2 2v1H5V4a2 2 0 0 1 2-2z"/>
        <circle cx="16" cy="15" r="1.5"/>
      </svg>
    </div>
    <div class="loader-text">My Wallet</div>
    <div class="loader-sub">Smart Finance Management</div>
    <div class="loader-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Prevent service worker controllerchange auto-reload during active user interaction
    if ('serviceWorker' in navigator) {
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(e) {
        if (refreshing) return;
        refreshing = true;
      });
    }

    // Hide the PWA loader once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('pwa-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
</body>
</html>
