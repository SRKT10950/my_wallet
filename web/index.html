<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="My Wallet - Personal Finance, Expense Tracking, Daily Budget & Product Manager.">
  <meta name="theme-color" content="#0E111F">

  <!-- iOS Meta Tags & Native Standalone Config -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Wallet">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Wallet Enterprise PWA</title>
  <link rel="manifest" href="manifest.json">

  <!-- Custom PWA Manager -->
  <script src="pwa_manager.js"></script>

  <style>
    html, body {
      background-color: #080914;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      width: 100%;
      height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    #pwa-install-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: linear-gradient(135deg, #16192E 0%, #0E111F 100%);
      border: 1.5px solid #00F5D4;
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 16px;
      color: #FFFFFF;
      max-width: 90vw;
      width: 440px;
      transition: all 0.3s ease-in-out;
    }
    #pwa-install-banner.hidden {
      display: none !important;
      pointer-events: none !important;
    }
    .pwa-btn-install {
      background-color: #00F5D4;
      color: #000000;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .pwa-btn-close {
      background: transparent;
      color: #A0AEC0;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" class="hidden">
    <div style="font-size: 24px;">📱</div>
    <div style="flex: 1;">
      <div style="font-weight: bold; font-size: 14px;">Install My Wallet App</div>
      <div style="font-size: 11px; color: #A0AEC0;">Full-screen standalone & offline experience</div>
    </div>
    <button class="pwa-btn-install" onclick="triggerPwaInstall()">INSTALL</button>
    <button class="pwa-btn-close" onclick="closePwaBanner()">✕</button>
  </div>

  <script>
    let deferredPwaPrompt = null;
    const banner = document.getElementById('pwa-install-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPwaPrompt = e;
      if (banner && (!window.myWalletPwa || !window.myWalletPwa.isStandalone())) {
        banner.classList.remove('hidden');
      }
    });

    function triggerPwaInstall() {
      if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        deferredPwaPrompt.userChoice.then((choice) => {
          deferredPwaPrompt = null;
          if (banner) banner.classList.add('hidden');
        });
      } else {
        alert("To Install My Wallet:\n\n• On iPhone / iPad (Safari): Tap Share button (↑) -> 'Add to Home Screen'\n• On Android (Chrome): Tap Menu (⋮) -> 'Install app' or 'Add to Home screen'\n• On Windows / Mac / Linux: Click the Install icon in the browser address bar.");
      }
    }

    function closePwaBanner() {
      if (banner) banner.classList.add('hidden');
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
